<html>

<head>
    <title>mouse Event</title>
</head>

<body style="text-align:center">
    <h2>Mouse Handling</h2>
    <img id="img-tag" src="summer.jpeg"
        onmouseover="changeImg()" onmouseout="setOld()" width="220px" height="230px" alt="image" />
    <script>
        function changeImg() {
            document.getElementById("img-tag").src =
                "winter.jpeg";
        }
        function setOld() {
            document.getElementById("img-tag").src = "summer.jpeg";
        }
    </script>
</body>

</html>
